name: Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --all-targets

  build-and-publish:
    needs: quality-gate
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package artifacts (Windows)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "target/x86_64-pc-windows-msvc/release/windows-settings.exe"
          Copy-Item $exe "windows-settings-$tag.exe"

          Compress-Archive -Path "windows-settings-$tag.exe" -DestinationPath "windows-settings-$tag.zip"

          (Get-FileHash "windows-settings-$tag.zip" -Algorithm SHA256).Hash.ToLower() + "  windows-settings-$tag.zip" |
            Out-File -Encoding ASCII "windows-settings-$tag.zip.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-settings-*.exe
            windows-settings-*.zip
            windows-settings-*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}