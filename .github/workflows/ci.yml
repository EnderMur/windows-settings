name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-fmt:
    name: Cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test-matrix:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-matrix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-matrix-

      - name: Cargo check
        run: cargo check --all-targets

      - name: Run unit tests
        run: cargo test --lib 2>&1

      - name: Verify binary builds
        run: cargo build --release

      - name: Verify binary exists
        shell: pwsh
        run: |
          if (!(Test-Path "target/release/windows-settings.exe")) {
            Write-Error "windows-settings.exe not found on ${{ matrix.os }}"
            exit 1
          }
          $info = Get-Item "target/release/windows-settings.exe"
          Write-Host "✅ ${{ matrix.os }} OK — windows-settings.exe ($($info.Length) bytes)"

  version-check:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: detect
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*=.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          TAG_VERSION="${LATEST_TAG#v}"

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📦 Version changed: $TAG_VERSION → $VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Version unchanged: $VERSION"
          fi

  build:
    name: Build check
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Cargo check
        run: cargo check --all-targets 2>&1 | tee check.log

      - name: Cargo build
        run: cargo build --release

      - name: Verify binary exists
        run: |
          if (!(Test-Path "target/release/windows-settings.exe")) {
            Write-Error "windows-settings.exe not found"
            exit 1
          }
          $size = (Get-Item "target/release/windows-settings.exe").Length
          Write-Host "✅ Build OK — windows-settings.exe ($size bytes)"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-settings-exe
          path: target/release/windows-settings.exe
          retention-days: 7

  test-functions:
    name: Test functions
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "ci-results" -Force | Out-Null
          $logPath = "ci-results/functions-tests.log"
          cargo test --lib -- --color never 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE

          $testLines = @(
            Get-Content -LiteralPath $logPath |
              Where-Object { $_ -match '^test .+ \.\.\. (ok|FAILED|ignored)$' }
          )
          $summaryLines = @(
            Get-Content -LiteralPath $logPath |
              Where-Object { $_ -match '^test result:' }
          )

          @(
            "### Functions Details"
            ""
            '```text'
            $testLines
            ""
            $summaryLines
            '```'
          ) | Set-Content -LiteralPath "ci-results/functions-summary.md"

          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Upload function test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: function-test-results
          path: ci-results/functions-summary.md
          retention-days: 7

  test-commands:
    name: Test PowerShell commands
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Test Get-AppxPackage
        run: |
          $result = powershell -NoProfile -Command "Get-AppxPackage | ForEach-Object { $_.Name }"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Get-AppxPackage failed"
            exit 1
          }
          $count = ($result | Measure-Object).Count
          Write-Host "✅ Get-AppxPackage OK — $count packages found"

      - name: Test Get-CimInstance (SysInfo)
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $cs = Get-CimInstance Win32_ComputerSystem
          Write-Host "✅ SysInfo OK — $($os.Caption), $($cpu.Name)"

      - name: Test registry read
        run: |
          $val = Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion" -Name "ProductName" -ErrorAction Stop
          Write-Host "✅ Registry read OK — $($val.ProductName)"

      - name: Test service queries
        run: |
          $svc = Get-Service -Name 'DiagTrack' -ErrorAction SilentlyContinue
          if ($null -ne $svc) {
            Write-Host "✅ Service query OK — DiagTrack: $($svc.StartType)"
          } else {
            Write-Host "⚠️ DiagTrack not found (expected on some runners)"
          }

      - name: Test scheduled task query
        run: |
          $tasks = Get-ScheduledTask -TaskName 'GoogleUpdateTask*' -ErrorAction SilentlyContinue
          Write-Host "✅ Scheduled task query OK — $($tasks.Count) GoogleUpdate tasks"

      - name: Test ipconfig /flushdns
        run: |
          ipconfig /flushdns | Out-Null
          Write-Host "✅ DNS flush OK"

  test-autoupdate:
    name: Test auto-update
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-update-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-update-

      - name: Run update tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test -- check_latest_release 2>&1

      - name: Verify GitHub API reachable
        shell: bash
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/EnderMur/windows-settings/releases")
          if [ "$STATUS" != "200" ]; then
            echo "❌ GitHub API returned $STATUS"
            exit 1
          fi
          echo "✅ GitHub API reachable (HTTP $STATUS)"

  test-services:
    name: Test services
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-services-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-services-

      - name: Run service unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "ci-results" -Force | Out-Null
          $logPath = "ci-results/services-tests.log"
          cargo test --lib -- services --color never 2>&1 | Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE

          $testLines = @(
            Get-Content -LiteralPath $logPath |
              Where-Object { $_ -match '^test .+ \.\.\. (ok|FAILED|ignored)$' }
          )
          $summaryLines = @(
            Get-Content -LiteralPath $logPath |
              Where-Object { $_ -match '^test result:' }
          )

          @(
            "### Services Unit Tests"
            ""
            '```text'
            $testLines
            ""
            $summaryLines
            '```'
          ) | Set-Content -LiteralPath "ci-results/services-summary.md"

          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Upload service test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-test-results
          path: ci-results/services-summary.md
          retention-days: 7

      - name: Test service status script (EncodedCommand)
        shell: pwsh
        run: |
          $script = @'
          $ErrorActionPreference = 'SilentlyContinue'
          foreach ($svc in @(
              @{Key='diagtrack'; Name='DiagTrack'},
              @{Key='bits'; Name='BITS'},
              @{Key='wsearch'; Name='WSearch'},
              @{Key='dosvc'; Name='DoSvc'},
              @{Key='pcasvc'; Name='PcaSvc'}
          )) {
              $s = Get-Service -Name $svc.Name -ErrorAction SilentlyContinue
              if ($s) {
                  $status = if ($s.Status -eq 'Running') { 'running' } else { 'stopped' }
                  $startup = switch ($s.StartType) {
                      'Disabled' { 'disabled' }
                      'Automatic' { 'automatic' }
                      'Manual' { 'manual' }
                      default { 'unknown' }
                  }
                  Write-Output "$($svc.Key)=$status`:$startup"
              } else {
                  Write-Output "$($svc.Key)=unknown:unknown"
              }
          }
          '@
          $bytes = [System.Text.Encoding]::Unicode.GetBytes($script)
          $encoded = [Convert]::ToBase64String($bytes)
          $result = powershell.exe -NoProfile -ExecutionPolicy Bypass -NonInteractive -EncodedCommand $encoded
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Service status script failed with exit code $LASTEXITCODE"
            exit 1
          }
          $entries = ($result | Where-Object { $_ -match '^\w+=\w+:\w+$' } | Measure-Object).Count
          if ($entries -eq 0) {
            Write-Error "Service status script returned 0 entries"
            exit 1
          }
          Write-Host "✅ Service status OK — $entries entries"
          $result | ForEach-Object { Write-Host "  $_" }

      - name: Test service disable script
        shell: pwsh
        run: |
          $script = @'
          $ErrorActionPreference = 'Continue'
          $svc = Get-Service -Name 'DiagTrack' -ErrorAction SilentlyContinue
          if ($svc) {
              Write-Output "DiagTrack exists: $($svc.Status) / $($svc.StartType)"
          } else {
              Write-Output "DiagTrack not found (expected on some runners)"
          }
          '@
          $bytes = [System.Text.Encoding]::Unicode.GetBytes($script)
          $encoded = [Convert]::ToBase64String($bytes)
          $result = powershell.exe -NoProfile -ExecutionPolicy Bypass -NonInteractive -EncodedCommand $encoded
          Write-Host "✅ Service info query OK"
          $result | ForEach-Object { Write-Host "  $_" }

      - name: Test all 9 service queries via EncodedCommand
        shell: pwsh
        run: |
          $script = @'
          $ErrorActionPreference = 'SilentlyContinue'
          $names = @('DiagTrack','dmwappushservice','WSearch','DoSvc','RetailDemo','XblGameSave','DcpSvc','PcaSvc','BITS')
          $found = 0
          foreach ($n in $names) {
              $s = Get-Service -Name $n -ErrorAction SilentlyContinue
              if ($s) { $found++ }
          }
          Write-Output "services_found=$found"
          Write-Output "services_total=$($names.Count)"
          '@
          $bytes = [System.Text.Encoding]::Unicode.GetBytes($script)
          $encoded = [Convert]::ToBase64String($bytes)
          $result = powershell.exe -NoProfile -ExecutionPolicy Bypass -NonInteractive -EncodedCommand $encoded
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Service enumeration failed"
            exit 1
          }
          $found = ($result | Where-Object { $_ -match 'services_found=(\d+)' } | ForEach-Object { [int]($_ -replace 'services_found=','') })
          $total = ($result | Where-Object { $_ -match 'services_total=(\d+)' } | ForEach-Object { [int]($_ -replace 'services_total=','') })
          Write-Host "✅ Service enumeration OK — $found / $total services found"
          if ($found -eq 0) {
            Write-Error "No services found at all — something is wrong"
            exit 1
          }

  test-memory:
    name: Test memory operations
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mem-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mem-

      - name: Run memory tests
        run: cargo test -- collect_mem_info 2>&1

      - name: Test NtQuerySystemInformation (read memory info)
        shell: pwsh
        run: |
          $src = @'
          using System;
          using System.Runtime.InteropServices;

          public static class MemTest {
              [DllImport("kernel32.dll", SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool GlobalMemoryStatusEx(ref MEMORYSTATUSEX lpBuffer);

              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Auto)]
              public struct MEMORYSTATUSEX {
                  public uint dwLength;
                  public uint dwMemoryLoad;
                  public ulong ullTotalPhys;
                  public ulong ullAvailPhys;
                  public ulong ullTotalPageFile;
                  public ulong ullAvailPageFile;
                  public ulong ullTotalVirtual;
                  public ulong ullAvailVirtual;
                  public ulong ullAvailExtendedVirtual;
              }

              public static string Get() {
                  var ms = new MEMORYSTATUSEX();
                  ms.dwLength = (uint)Marshal.SizeOf(typeof(MEMORYSTATUSEX));
                  if (!GlobalMemoryStatusEx(ref ms)) return "FAIL";
                  return $"total={ms.ullTotalPhys};avail={ms.ullAvailPhys};load={ms.dwMemoryLoad}";
              }
          }
          '@
          Add-Type -TypeDefinition $src -Language CSharp | Out-Null
          $result = [MemTest]::Get()
          if ($result -eq "FAIL") {
            Write-Error "GlobalMemoryStatusEx failed"
            exit 1
          }
          Write-Host "✅ GlobalMemoryStatusEx OK — $result"

      - name: Test NtSetSystemInformation (privilege elevation)
        shell: pwsh
        run: |
          $src = @'
          using System;
          using System.Runtime.InteropServices;

          public static class PrivTest {
              [StructLayout(LayoutKind.Sequential)]
              public struct LUID {
                  public uint LowPart;
                  public int HighPart;
              }

              [StructLayout(LayoutKind.Sequential)]
              public struct TOKEN_PRIVILEGES {
                  public uint PrivilegeCount;
                  public LUID Luid;
                  public uint Attributes;
              }

              [DllImport("advapi32.dll", SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool OpenProcessToken(IntPtr ProcessHandle, uint DesiredAccess, out IntPtr TokenHandle);

              [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Auto)]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool LookupPrivilegeValue(string lpSystemName, string lpName, out LUID lpLuid);

              [DllImport("advapi32.dll", SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool AdjustTokenPrivileges(IntPtr TokenHandle, bool DisableAllPrivileges, ref TOKEN_PRIVILEGES NewState, uint BufferLength, IntPtr PreviousState, IntPtr ReturnLength);

              [DllImport("kernel32.dll")]
              public static extern IntPtr GetCurrentProcess();

              [DllImport("kernel32.dll", SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool CloseHandle(IntPtr h);

              public static bool Test() {
                  IntPtr token;
                  if (!OpenProcessToken(GetCurrentProcess(), 0x0028, out token)) return false;
                  try {
                      LUID luid;
                      if (!LookupPrivilegeValue(null, "SeProfileSingleProcessPrivilege", out luid)) return false;
                      var tp = new TOKEN_PRIVILEGES {
                          PrivilegeCount = 1,
                          Luid = luid,
                          Attributes = 0x00000002
                      };
                      if (!AdjustTokenPrivileges(token, false, ref tp, 0, IntPtr.Zero, IntPtr.Zero)) return false;
                      return Marshal.GetLastWin32Error() == 0;
                  } finally {
                      CloseHandle(token);
                  }
              }
          }
          '@
          Add-Type -TypeDefinition $src -Language CSharp | Out-Null
          $ok = [PrivTest]::Test()
          if ($ok) {
            Write-Host "✅ Privilege elevation OK — SeProfileSingleProcessPrivilege enabled"
          } else {
            Write-Host "⚠️ Privilege elevation failed (expected without admin rights)"
          }

  code-coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: llvm-tools-preview

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: |
          cargo tarpaulin --lib --out xml --output-dir coverage \
            --skip-clean --engine llvm 2>&1 | tee coverage.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Parse coverage report
        if: always()
        shell: bash
        run: |
          if [ ! -f coverage/cobertura.xml ]; then
            echo "⚠️ No coverage report generated"
            exit 0
          fi
          TOTAL=$(grep -oP 'line-rate="\K[^"]+' coverage/cobertura.xml | head -1)
          PCT=$(echo "$TOTAL * 100" | bc -l | xargs printf "%.1f")
          echo "📊 Coverage: ${PCT}%"
          echo "## Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Line coverage | ${PCT}% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```xml' >> $GITHUB_STEP_SUMMARY
          head -5 coverage/cobertura.xml >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  binary-size:
    name: Binary size check
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-size-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-size-

      - name: Build release
        run: cargo build --release

      - name: Check binary size
        shell: pwsh
        run: |
          $exe = "target/release/windows-settings.exe"
          if (!(Test-Path $exe)) {
            Write-Error "Binary not found"
            exit 1
          }
          $size = (Get-Item $exe).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          $threshold = 20MB

          Write-Host "Binary size: $size bytes ($sizeMB MB)"

          echo "## Binary Size" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $size bytes ($sizeMB MB) |" >> $GITHUB_STEP_SUMMARY
          echo "| Threshold | $([math]::Round($threshold / 1MB, 0)) MB |" >> $GITHUB_STEP_SUMMARY

          if ($size -gt $threshold) {
            Write-Error "Binary too large: $sizeMB MB > $([math]::Round($threshold / 1MB, 0)) MB threshold"
            exit 1
          }
          Write-Host "✅ Size OK — $sizeMB MB (threshold: $([math]::Round($threshold / 1MB, 0)) MB)"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-settings-exe-size
          path: target/release/windows-settings.exe
          retention-days: 7

  shellcheck:
    name: PowerShell script lint
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Check for standalone PS scripts
        shell: pwsh
        run: |
          $psFiles = Get-ChildItem -Path "." -Filter "*.ps1" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\|\\target\\|\\.git\\' }

          echo "## PowerShell Lint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if ($null -eq $psFiles -or $psFiles.Count -eq 0) {
            echo "No standalone .ps1 files found — all PS is embedded in Rust source." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Lint skipped (no files to lint)"
            exit 0
          }

          echo "| File | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY

          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery
          Import-Module PSScriptAnalyzer

          $totalIssues = 0
          foreach ($f in $psFiles) {
            $results = Invoke-ScriptAnalyzer -Path $f.FullName -Severity Error,Warning
            $count = ($results | Measure-Object).Count
            $totalIssues += $count
            $status = if ($count -eq 0) { "✅ OK" } else { "⚠️ $count issues" }
            echo "| $($f.Name) | $status |" >> $GITHUB_STEP_SUMMARY
            if ($count -gt 0) {
              $results | ForEach-Object { Write-Host "⚠️ $($f.Name): Line $($_.Line) — $($_.RuleName): $($_.Message)" }
            }
          }

          if ($totalIssues -gt 0) {
            Write-Error "Found $totalIssues PowerShell lint issues"
            exit 1
          }
          Write-Host "✅ PSScriptAnalyzer OK — $($psFiles.Count) files, 0 issues"

  test-elevated:
    name: Test elevated & normal user
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-elevated-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-elevated-

      - name: Detect privilege context
        shell: pwsh
        run: |
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          Write-Host "User: $identity"
          Write-Host "Admin: $isAdmin"

          echo "## Privilege Context" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| User | $identity |" >> $GITHUB_STEP_SUMMARY
          echo "| Is Admin | $isAdmin |" >> $GITHUB_STEP_SUMMARY

      - name: Run tests as admin
        shell: pwsh
        run: |
          cargo test --lib -- --color never 2>&1 | Tee-Object -FilePath "ci-results/admin-tests.log"
          $exitCode = $LASTEXITCODE

          echo "## Elevated (Admin) Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ($exitCode -eq 0) {
            echo "✅ All tests passed as admin" >> $GITHUB_STEP_SUMMARY
          } else {
            echo "❌ Tests failed as admin (exit code $exitCode)" >> $GITHUB_STEP_SUMMARY
            exit $exitCode
          }

      - name: Run tests as SYSTEM (via scheduled task)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "ci-results" -Force | Out-Null
          $testCmd = "cd `"$((Get-Location).Path)`" && cargo test --lib -- --color never 2>&1 > ci-results\system-tests.log"
          $taskName = "WSTestSystem"

          schtasks /Create /TN $taskName /TR "cmd /c $testCmd" /SC ONCE /ST 00:00 /F /RL HIGHEST /RU SYSTEM 2>$null | Out-Null
          schtasks /Run /TN $taskName | Out-Null

          $timeout = 300
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            $task = schtasks /Query /TN $taskName /FO CSV 2>$null | ConvertFrom-Csv
            if ($task.Status -ne "Running") { break }
            Start-Sleep -Seconds 5
            $elapsed += 5
          }
          schtasks /Delete /TN $taskName /F 2>$null | Out-Null

          if (Test-Path "ci-results/system-tests.log") {
            $log = Get-Content "ci-results\system-tests.log" -Raw
            $match = [regex]::Match($log, 'test result: (ok|FAILED).*?(\d+) passed')
            $passed = if ($match.Success) { $match.Groups[2].Value } else { "?" }
            $failed = $log -match 'test result: FAILED'

            echo "## SYSTEM User Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| User | NT AUTHORITY\SYSTEM |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests passed | $passed |" >> $GITHUB_STEP_SUMMARY

            if ($failed) {
              Write-Error "Tests failed as SYSTEM user"
              exit 1
            }
            Write-Host "✅ SYSTEM user tests OK — $passed passed"
          } else {
            Write-Host "⚠️ No output from SYSTEM task (timeout or permission issue)"
            echo "## SYSTEM User Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ No output — task may have timed out" >> $GITHUB_STEP_SUMMARY
          }

      - name: Test service operations under different privileges
        shell: pwsh
        run: |
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)

          $script = @'
          $ErrorActionPreference = 'SilentlyContinue'
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "admin=$isAdmin"

          $svc = Get-Service -Name 'DiagTrack' -ErrorAction SilentlyContinue
          if ($svc) {
            Write-Output "diagtrack_status=$($svc.Status)"
            Write-Output "diagtrack_starttype=$($svc.StartType)"
          } else {
            Write-Output "diagtrack=notfound"
          }

          $svc = Get-Service -Name 'BITS' -ErrorAction SilentlyContinue
          if ($svc) {
            Write-Output "bits_status=$($svc.Status)"
            Write-Output "bits_starttype=$($svc.StartType)"
          } else {
            Write-Output "bits=notfound"
          }
          '@
          $bytes = [System.Text.Encoding]::Unicode.GetBytes($script)
          $encoded = [Convert]::ToBase64String($bytes)
          $output = powershell.exe -NoProfile -ExecutionPolicy Bypass -NonInteractive -EncodedCommand $encoded
          $output | ForEach-Object { Write-Host "  $_" }

          echo "## Service Operations (as $($env:USERNAME))" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          $output | ForEach-Object { echo $_ >> $GITHUB_STEP_SUMMARY }
          echo '```' >> $GITHUB_STEP_SUMMARY

  perf-regression:
    name: Performance regression
    runs-on: windows-latest
    needs: version-check
    if: needs.version-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-perf-

      - name: Build release
        run: cargo build --release

      - name: Benchmark binary startup time
        shell: pwsh
        run: |
          $exe = "target/release/windows-settings.exe"
          if (!(Test-Path $exe)) {
            Write-Error "Binary not found"
            exit 1
          }

          $runs = 5
          $times = @()
          $threshold = 5000

          Write-Host "Benchmarking $exe ($runs runs)..."
          for ($i = 1; $i -le $runs; $i++) {
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $proc = Start-Process -FilePath $exe -PassThru -Wait -WindowStyle Hidden
            $sw.Stop()
            $ms = $sw.ElapsedMilliseconds
            $times += $ms
            Write-Host "  Run $i`: ${ms}ms (exit code $($proc.ExitCode))"
          }

          $avg = ($times | Measure-Object -Average).Average
          $max = ($times | Measure-Object -Maximum).Maximum
          $min = ($times | Measure-Object -Minimum).Minimum

          Write-Host ""
          Write-Host "Results:"
          Write-Host "  Average: $([math]::Round($avg, 0))ms"
          Write-Host "  Min: ${min}ms"
          Write-Host "  Max: ${max}ms"

          echo "## Performance Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Runs | $runs |" >> $GITHUB_STEP_SUMMARY
          echo "| Average | $([math]::Round($avg, 0))ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Min | ${min}ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Max | ${max}ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Threshold | ${threshold}ms |" >> $GITHUB_STEP_SUMMARY
          echo "| All times | $($times -join ', ')ms |" >> $GITHUB_STEP_SUMMARY

          if ($avg -gt $threshold) {
            Write-Error "Average startup time $([math]::Round($avg, 0))ms exceeds ${threshold}ms threshold"
            exit 1
          }
          Write-Host "✅ Performance OK — avg $([math]::Round($avg, 0))ms (threshold: ${threshold}ms)"

      - name: Check compilation time
        shell: pwsh
        run: |
          cargo clean 2>$null | Out-Null
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          cargo build --release 2>&1 | Out-Null
          $sw.Stop()
          $buildTime = $sw.ElapsedMilliseconds

          echo "## Build Performance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Release build time | $([math]::Round($buildTime / 1000, 1))s |" >> $GITHUB_STEP_SUMMARY

          Write-Host "Release build time: $([math]::Round($buildTime / 1000, 1))s"

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint-fmt, security-audit, version-check, build, test-functions, test-commands, test-services, test-matrix, test-autoupdate, test-memory, code-coverage, binary-size, shellcheck, test-elevated, perf-regression]
    if: always()
    steps:
      - name: Download function test results
        if: needs.test-functions.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: function-test-results
          path: ci-results

      - name: Download service test results
        if: needs.test-services.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: service-test-results
          path: ci-results

      - name: Results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Formatting | ${{ needs.lint-fmt.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version changed | ${{ needs.version-check.outputs.changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions | ${{ needs.test-functions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commands | ${{ needs.test-commands.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Services | ${{ needs.test-services.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Matrix (2022/latest) | ${{ needs.test-matrix.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto-update | ${{ needs.test-autoupdate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory | ${{ needs.test-memory.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code coverage | ${{ needs.code-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Binary size | ${{ needs.binary-size.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PowerShell lint | ${{ needs.shellcheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Elevated tests | ${{ needs.test-elevated.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.perf-regression.result }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f ci-results/functions-summary.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat ci-results/functions-summary.md >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f ci-results/services-summary.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat ci-results/services-summary.md >> $GITHUB_STEP_SUMMARY
          fi
